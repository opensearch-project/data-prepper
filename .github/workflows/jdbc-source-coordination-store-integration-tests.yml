name: JDBC source coordination store integration tests

on:
  push:
    paths:
      - 'data-prepper-plugins/jdbc-source-coordination-store/**'
      - '*gradle*'
  pull_request:
    paths:
      - 'data-prepper-plugins/jdbc-source-coordination-store/**'
      - '*gradle*'
  workflow_dispatch:

jobs:
  integration-tests:
    strategy:
      matrix:
        include:
          - database: postgresql
            service: postgres
            jdbc_url: 'jdbc:postgresql://localhost:5433/dataprepper'
            ready_command: 'pg_isready -U dp_user -d dataprepper'
          - database: mysql
            service: mysql
            jdbc_url: 'jdbc:mysql://localhost:3307/dataprepper'
            ready_command: 'mysqladmin ping -h localhost -u dp_user -pdp_pass --silent'
      fail-fast: false

    runs-on: ubuntu-latest

    steps:
      - name: Set up JDK 11
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: 11
          distribution: temurin
      - name: Checkout Data Prepper
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Start ${{ matrix.database }}
        run: |
          docker compose -f data-prepper-plugins/jdbc-source-coordination-store/docker/docker-compose.yml up -d ${{ matrix.service }}
      - name: Wait for ${{ matrix.database }} to be ready
        run: |
          for i in $(seq 1 60); do
            if docker compose -f data-prepper-plugins/jdbc-source-coordination-store/docker/docker-compose.yml exec -T ${{ matrix.service }} ${{ matrix.ready_command }} > /dev/null 2>&1; then
              echo "${{ matrix.database }} is ready"
              exit 0
            fi
            sleep 3
          done
          echo "${{ matrix.database }} did not become ready in time" >&2
          exit 1
      - name: Run integration tests against ${{ matrix.database }}
        run: ./gradlew data-prepper-plugins:jdbc-source-coordination-store:integrationTest -Dtests.jdbc.url='${{ matrix.jdbc_url }}' -Dtests.jdbc.username=dp_user -Dtests.jdbc.password=dp_pass
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: jdbc-source-coordination-store-integration-test-results-${{ matrix.database }}
          path: '**/test-results/**/*.xml'
