rds-pipeline:
  source:
    rds:
      db_identifier: "my-rds-cluster"
      cluster: true
      engine: "mysql"
      database: "mydb"
      acknowledgments: true
      authentication:
        username: ${{aws_secrets:secret:username}}
        password: ${{aws_secrets:secret:password}}
      aws:
        sts_role_arn: "arn:aws:iam::123456789012:role/MyRole"
        region: "us-east-1"
      s3_bucket: "my-staging-bucket"
      s3_region: "us-east-1"
      s3_prefix: "osis-rds"
      scan_mode: "continuous"
      stream: true
  sink:
    - opensearch:
        hosts: ["https://search-mydomain.us-east-1.es.amazonaws.com"]
        index: "my-index"
        index_type: custom
        document_id: "${getMetadata(\"primary_key\")}"
        action: "${getMetadata(\"opensearch_action\")}"
        aws:
          sts_role_arn: "arn:aws:iam::123456789012:role/MyRole"
          region: "us-east-1"

extension:
  aws:
    secrets:
      secret:
        secret_id: "my-rds-secret"
        region: "us-east-1"
        refresh_interval: PT1H
