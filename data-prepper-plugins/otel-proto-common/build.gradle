plugins {
    id 'java-library'
    id 'com.google.protobuf' version '0.9.4'
}

test {
    jvmArgs '-Xmx1g'
}

tasks.named('checkstyleMain') {
    source = source.filter { File f -> !f.absolutePath.contains('/build/generated/') }
}

protobuf {
    protoc {
        artifact = "com.google.protobuf:protoc:${libs.versions.protobuf.get()}"
    }
    plugins {
        grpc {
            artifact = "io.grpc:protoc-gen-grpc-java:${libs.versions.grpc.get()}"
        }
    }
    generateProtoTasks {
        all()*.plugins {
            grpc {}
        }
    }
}

dependencies {
    implementation project(':data-prepper-api')
    protobuf 'io.opentelemetry.proto:opentelemetry-proto:1.11.0-alpha:sources@jar'
    api libs.protobuf.util
    api "io.grpc:grpc-stub:${libs.versions.grpc.get()}"
    api "io.grpc:grpc-protobuf:${libs.versions.grpc.get()}"
    compileOnly 'javax.annotation:javax.annotation-api:1.3.2'
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-yaml'
    implementation libs.commons.lang3
    implementation libs.commons.codec
    testImplementation 'org.assertj:assertj-core:3.27.7'
}
