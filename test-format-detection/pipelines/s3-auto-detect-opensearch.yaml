# Auto-detect pipeline with OpenSearch sink
s3-auto-detect-pipeline:
  source:
    s3:
      aws:
        region: "us-east-1"
        sts_role_arn: "arn:aws:iam::463470984675:role/Admin"
      scan:
        buckets:
          - bucket:
              name: "siqi-format-detector-bucket"
              filter:
                include_prefix:
                  - "test-data/"
  sink:
    - opensearch:
        hosts: ["https://search-performance-test-karge-khjgzsxmasemes3xcfmaepgwbe.us-east-1.es.amazonaws.com"]
        index: "format-detection-test-v2"
        aws:
          region: "us-east-1"
          sts_role_arn: "arn:aws:iam::463470984675:role/Admin"
          serverless: false
