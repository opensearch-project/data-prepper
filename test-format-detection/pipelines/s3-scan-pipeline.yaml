s3-scan-format-detection:
  source:
    s3:
      codec:
        newline:
      compression: "none"
      aws:
        region: "us-east-1"
        sts_role_arn: "arn:aws:iam::<YOUR_ACCOUNT_ID>:role/<YOUR_ROLE_NAME>"
      scan:
        buckets:
          - bucket:
              name: "<YOUR_BUCKET_NAME>"
              filter:
                include_prefix:
                  - "test-data/"
  processor:
    - detect_format:
        source: "message"
        target_key: "detected_format"
  sink:
    - stdout:
