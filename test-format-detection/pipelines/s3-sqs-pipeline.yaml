s3-format-detection-pipeline:
  source:
    s3:
      notification_type: "sqs"
      codec:
        newline:
      compression: "none"
      sqs:
        queue_url: "https://sqs.us-east-1.amazonaws.com/<YOUR_ACCOUNT_ID>/<YOUR_QUEUE_NAME>"
      aws:
        region: "us-east-1"
        sts_role_arn: "arn:aws:iam::<YOUR_ACCOUNT_ID>:role/<YOUR_ROLE_NAME>"
  processor:
    - detect_format:
        source: "message"
        target_key: "detected_format"
  sink:
    - stdout:
